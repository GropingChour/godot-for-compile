name: 🍏 iOS Simulator Template Export
on:
  workflow_call:
  workflow_dispatch:

# Global Settings
env:
  SCONS_FLAGS: >-
    verbose=yes
    debug_symbols=no

jobs:
  ios-simulator-template:
    runs-on: macos-latest
    name: iOS Simulator Template (target=release)
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 3.6
          submodules: recursive

      # Setup Xcode - use latest stable version available on runner
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Xcode and SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-path
          xcrun simctl list

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ios-simulator-template
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Compilation (x86_64 simulator)
        uses: ./.github/actions/godot-build
        with:
          sconsflags: ${{ env.SCONS_FLAGS }} arch=x86_64 ios_simulator=yes
          platform: ios
          target: release
          tools: no

      - name: Compilation (arm64 simulator)
        uses: ./.github/actions/godot-build
        with:
          sconsflags: ${{ env.SCONS_FLAGS }} arch=arm64 ios_simulator=yes
          platform: ios
          target: release
          tools: no

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ios-simulator-template
        continue-on-error: true

      - name: Prepare artifact
        run: |
          lipo -create ./bin/godot.iphone.opt.x86_64.simulator ./bin/godot.iphone.opt.arm64.simulator -output ./bin/godot.iphone.opt.simulator
          rm ./bin/godot.iphone.opt.x86_64.simulator ./bin/godot.iphone.opt.arm64.simulator
          strip bin/godot.iphone.opt.simulator
          chmod +x bin/godot.iphone.opt.simulator

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: ios-simulator-template
